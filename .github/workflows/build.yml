name: Build Windows EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install PyInstaller
      run: pip install pyinstaller

    - name: Build EXEs
      run: |
        pyinstaller --onefile --name Organize-Downloads Organize-Downloads.py
        pyinstaller --onefile --name Organize-Desktop Organize-Desktop.py

    - name: Upload EXEs to Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          dist/Organize-Downloads.exe
          dist/Organize-Desktop.exe
          Organize-Downloads.py
          Organize-Desktop.py
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload artifacts (manual run)
      if: "!startsWith(github.ref, 'refs/tags/')"
      uses: actions/upload-artifact@v4
      with:
        name: windows-exe
        path: |
          dist/Organize-Downloads.exe
          dist/Organize-Desktop.exe
