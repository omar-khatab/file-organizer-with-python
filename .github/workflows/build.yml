name: Build File Organizer v3.2 EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 pyinstaller

      - name: Check files
        run: |
          dir
          if (Test-Path "icon.ico") { echo "icon.ico found" } else { echo "icon.ico NOT found - will build without icon" }
          if (Test-Path "Organize-PySide6.py") { echo "v3.2 found - Organize-PySide6.py" } else { Write-Error "Organize-PySide6.py not found!"; exit 1 }

      - name: Build Modern EXE (v3.2)
        shell: pwsh
        run: |
          $target = "Organize-PySide6.py"
          echo "Building $target"
          
          $iconArg = ""
          if (Test-Path "icon.ico") { $iconArg = '--icon=icon.ico --add-data "icon.ico;."' }
          
          # Build windowed, onefile, with icon and data
          $cmd = "pyinstaller --onefile --windowed --name FileOrganizer-Modern --clean --noconfirm $iconArg $target"
          echo $cmd
          Invoke-Expression $cmd
          
          dir dist
          if (-not (Test-Path "dist/FileOrganizer-Modern.exe")) { Write-Error "Build failed - exe not found"; exit 1 }

      - name: Create Release v3.2
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/FileOrganizer-Modern.exe
          generate_release_notes: true
          body: |
            ## File Organizer PRO v3.2 - Production Ready
            ### Omar Khatab
            
            **Current Stable - v3.2 (PySide6 GUI)**
            
            **Features:**
            - Dark GUI + Drag & Drop
            - Live Watch + Auto Organize (work together)
            - History (SQLite) + Undo
            - Dry-run Preview
            - System Tray + Start with Windows
            - Right-Click Integration
            - Safe: no overwrite, skips protected / hidden files
            - Works with OneDrive / moved folders
            - Arabic / English
            
            **How to use:**
            1. Download FileOrganizer-Modern.exe
            2. Double click -> GUI
            3. Right click folder -> Organize with File Organizer (after Install Right-Click)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact (manual run)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: FileOrganizer-Modern-v3.2
          path: dist/FileOrganizer-Modern.exe
          retention-days: 30
