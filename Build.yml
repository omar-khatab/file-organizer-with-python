name: Build Windows EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install PyInstaller
        run: pip install pyinstaller
        
      - name: Build EXEs
        run: |
          pyinstaller --onefile --name Organize-Downloads Organize-Downloads.py
          pyinstaller --onefile --name Organize-Desktop Organize-Desktop.py
          dir dist
          
      - name: Create Release with EXEs
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Organize-Downloads.exe
            dist/Organize-Desktop.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
